name: Auto-post twice daily

on:
    schedule:
        - cron: "17 8 * * *"
          timezone: "Africa/Casablanca"
        - cron: "47 15 * * *"
          timezone: "Africa/Casablanca"
    workflow_dispatch:

jobs:
    post:
        runs-on: ubuntu-latest
        env:
            BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
            MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
            PIXELFED_TOKEN: ${{ secrets.PIXELFED_TOKEN }}
            TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
            TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
            TUMBLR_TOKEN_KEY: ${{ secrets.TUMBLR_TOKEN_KEY }}
            TUMBLR_TOKEN_SECRET: ${{ secrets.TUMBLR_TOKEN_SECRET }}
            SUBSTACK_COOKIE_SID: ${{ secrets.SUBSTACK_COOKIE_SID }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Install dev dependencies
              run: npm ci

            - name: Clean before post
              run: npm run clean

            - name: Post content
              run: npm run post
